name: Deploy backend

on:
  push:
    branches: [main, "claude/**"]
    paths: [backend/**]
  workflow_dispatch:

concurrency: backend-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npx tsc --noEmit
        working-directory: backend
      - name: Deploy to the VM
        env:
          VM_DEPLOY_KEY: ${{ secrets.VM_DEPLOY_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C backend src package.json package-lock.json | ssh -i ~/.ssh/deploy ubuntu@"$VM_HOST" backend
          curl -fsS --retry 30 --retry-delay 3 --retry-all-errors https://api.letdoyo.com/health
