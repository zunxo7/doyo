name: Build Android APK

# Only native changes need a new APK; everything else ships as an app update.
on:
  push:
    branches: [main]
    paths: [frontend/app.json, frontend/package.json]
  workflow_dispatch:

concurrency: android-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: frontend
      - name: Generate the native project
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install
      - name: Use the Doyo signing key
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # The generated project signs release builds with android/app/debug.keystore.
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore
      - name: Build
        working-directory: frontend/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        # The generated gradle.properties caps Metaspace at 512m, which the Kotlin compile outgrows.
        # x86_64 is included so the APK also runs on emulators.
        run: >
          ./gradlew assembleRelease --console=plain
          -PreactNativeArchitectures=arm64-v8a,x86_64
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
      - uses: actions/upload-artifact@v4
        with:
          name: doyo-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
      - name: Publish to the VM
        env:
          VM_DEPLOY_KEY: ${{ secrets.VM_DEPLOY_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy ubuntu@"$VM_HOST" apk < frontend/android/app/build/outputs/apk/release/app-release.apk
