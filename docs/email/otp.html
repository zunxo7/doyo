<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Your Doyo verification code</title>
  </head>
  <!-- The pattern, wordmark and title are images, so no email client's dark mode or font swap changes the look; every image has a solid colour behind it. -->
  <body style="margin:0;padding:0;background:#1d1d1d;color:#ffffff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" background="https://letdoyo.com/assets/email/background.png?v=1" bgcolor="#1d1d1d" style="width:100%;background-color:#1d1d1d;background-image:url('https://letdoyo.com/assets/email/background.png?v=1');">
      <tr>
        <td align="center" style="padding:44px 18px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">
            <tr>
              <td align="center" style="padding:0 0 26px;">
                <img src="https://letdoyo.com/assets/email/wordmark.png?v=1" width="126" height="60" alt="Doyo" style="display:block;width:126px;height:60px;border:0;" />
              </td>
            </tr>
            <tr>
              <td background="https://letdoyo.com/assets/email/card.png?v=1" bgcolor="#343434" style="overflow:hidden;border-radius:22px;background-color:#343434;background-image:url('https://letdoyo.com/assets/email/card.png?v=1');">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="padding:38px 30px 14px;">
                      <img src="https://letdoyo.com/assets/email/title.png?v=1" width="240" height="35" alt="Verify your email" style="display:block;width:240px;height:35px;border:0;" />
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:0 34px;">
                      <p style="margin:0;color:#b7b7b7;font:400 15px/24px Arial,sans-serif;"><span style="color:#ffffff;">Use this code</span> to finish signing in to Doyo. It expires in <span style="color:#ffffff;">10 minutes</span>.</p>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:30px 28px;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td align="center" bgcolor="#1d1d1d" style="border:1px solid #00baf0;border-radius:14px;background:#1d1d1d;padding:17px 28px;color:#ffffff;font:700 36px/42px Arial,sans-serif;letter-spacing:10px;text-indent:10px;">{{params.otp}}</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:0 30px;"><div style="height:1px;background:#4a4b4d;font-size:0;line-height:0;">&nbsp;</div></td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:22px 32px 34px;">
                      <p style="margin:0;color:#b7b7b7;font:400 12px/19px Arial,sans-serif;">Didn&rsquo;t request this? You can ignore this email.<br /><span style="color:#ffffff;">Never share this code. Doyo will never ask for it.</span></p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 18px 0;">
                <p style="margin:0;color:#ffffff;font:400 12px/19px Arial,sans-serif;">&copy; 2026 Doyo &middot; Let Doyo do it for you</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
